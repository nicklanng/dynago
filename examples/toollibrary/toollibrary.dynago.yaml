# yaml-language-server: $schema=../../schema/dynago.schema.json
#
# A neighbourhood tool library. Members borrow drills and tents instead of buying them, reserve a
# tool for pickup with a code, and stewards run the place. A fictional domain, chosen to show most
# of dynago in one realistic table: dynago.policy.yaml beside it holds the rules it is checked
# against.
#
# The rules that matter hold in single transactions, so no crash or race can leave them half done:
#   - Borrow creates the loan, marks the tool on loan, counts it against the member's cap, and
#     collects the member's own pickup hold, checking the member is active and nobody else holds
#     the tool. Return reverses the tool and the count.
#   - A hold reserves the tool: while it is live, only its member can borrow the tool. Holds lapse
#     by TTL, with nothing to undo, because a hold changes nothing but itself.
#   - A member with tools out can't leave, and the last active steward can't be suspended, demoted
#     or leave.
dynago: 1
package: toollibrary

table:
  name: toollibrary
  doc: Libraries, their members and tools, loans and pickup holds.
  # Generation 2 added tool barcodes, with a unique claim per label: existing tools had no claims,
  # so the table moved to a new generation. Generation 3 added the list of every library (index
  # Library.All), whose entries existing libraries lacked. Generation 2 stays for rollback.
  generation: 3
  retain: [2]

output:
  migrate_cmd: cmd/migrate-toollibrary

# What the design is sized for: the volumes below are expected three years in, and traffic peaks
# at five times its average (Saturday mornings).
workload: { horizon: 3 years, peak: 5 }

entities:
  Library:
    doc: A tool library, run by volunteers in one neighbourhood. Each is a tenant of the service.
    version: 2 # v2 (generation 3) added the All index
    fields:
      libraryId: { type: string, example: lib_1 }
      name: { type: string, size: 20/80, required: true }
      slug: { type: string, size: 12/40, example: greenwood, doc: The library's URL name. }
      openedAt: time
    key:
      pk: "LIB#{libraryId}"
      sk: "LIBRARY"
    indexes:
      All:
        # One partition holds every library. That's deliberate: 2,000 entries are a few hundred
        # KB, read a few times a minute, and dynago's analysis reports the numbers as a note.
        doc: "Every library, alphabetically, for the operators' admin pages: the tenant list."
        pk: "LIBRARIES"
        sk: "{name|lower}#{libraryId}"
        project: [slug, openedAt]
    unique:
      Slug:
        doc: Routes /l/{slug} to its library. Global, because the URL carries nothing else.
        fields: [slug]
    access:
      Get: { get: key, freshness: eventual, rate: 5 }
      GetBySlug: { get: { unique: Slug }, freshness: eventual, rate: 20 }
      MemberStats: { counter: MemberCounts, freshness: eventual, rate: 2, doc: "The member counts, read from the library's page." }
      ToolStats: { counter: ToolCounts, freshness: eventual, rate: 2 }
      List: { query: All, page: 50, freshness: eventual, rate: 0.1, doc: "Every library, a page at a time, for the operators." }
    writes:
      Open: create
      Rename: { patch: [name], versioned: required, doc: "A steward editing the library's settings." }
      ChangeSlug: { update: [slug], versioned: required }
    volume: 2000

  Member:
    doc: A person who can borrow tools from one library.
    fields:
      libraryId: { type: string, example: lib_1 }
      memberId: { type: string, example: m_7 }
      email: { type: string, size: 25/80, doc: "Stored as given; matched case-insensitively." }
      name: { type: string, size: 15/60 }
      phone: string
      role: { type: enum, values: [member, steward] }
      status: { type: enum, values: [active, suspended] }
      maxLoans: { type: int, doc: How many tools the member may have out at once. }
      joinedAt: time
    key:
      pk: "LIB#{libraryId}"
      sk: "MEMBER#{memberId}"
    indexes:
      ByName:
        doc: "The member directory, alphabetical. Lower-cased in the key, so \"adam\" sorts before \"Zoe\"."
        pk: "LIB#{libraryId}#MEMBERS"
        sk: "{name|lower}#{memberId}"
        project: [role, status]
        accept:
          sparse-index: "Members invited by email join without a name, and stay out of the directory until they give one."
    unique:
      Email:
        doc: One membership per email address in each library, ignoring case.
        fields: [libraryId, email]
        pk: "UNIQUE#Member.Email#{libraryId}#{email|lower}"
    counters:
      MemberCounts:
        doc: Holds the library's member numbers.
        pk: "LIB#{libraryId}"
        sk: "COUNTS#MEMBERS"
        values:
          active: { count: true, where: { status: active } }
          suspended: { count: true, where: { status: suspended } }
          stewards: { count: true, where: { role: steward, status: active }, min: 1, doc: A library always keeps at least one active steward. }
    access:
      Get: { get: key, freshness: immediate, rate: 10, doc: "A member's profile, which they see straight after editing it." }
      GetByEmail: { get: { unique: Email }, freshness: immediate, rate: 1, doc: "Sign-in, which may come the moment after joining." }
      Directory: { query: ByName, freshness: eventual, rate: 2 }
    writes:
      Join: create
      UpdateProfile: { patch: [name, phone], doc: "The member editing their own profile; only what they changed is sent." }
      SetLoanCap: { update: [maxLoans] }
      Suspend: { set: { status: suspended }, when: { status: active } }
      Reinstate: { set: { status: active }, when: { status: suspended } }
      MakeSteward: { set: { role: steward }, when: { role: member } }
      StepDown: { set: { role: member }, when: { role: steward } }
      Leave:
        delete: true
        requires:
          MemberLoans: { key: { libraryId: libraryId, memberId: memberId }, when: { active: 0 } }
        doc: Members return everything before they go.
    # Most libraries are small; the largest (a university's) has thousands of members.
    volume: { typical: 20, max: 2000 }

  Tool:
    doc: A tool the library lends out.
    version: 2 # v2 (generation 2) added barcodes
    fields:
      libraryId: { type: string, example: lib_1 }
      toolId: { type: string, example: t_42 }
      name: { type: string, size: 20/60 }
      category: { type: enum, values: [power, garden, hand, kitchen, camping] }
      status: { type: enum, values: [available, onLoan, retired] }
      manual: { type: string, size: 2000/20000, doc: "Care and safety notes. Large, so never listed." }
      tags: { type: string_set, size: 30/120 }
      serialNumber: { type: string, doc: "The maker's serial number, if it has one." }
      barcodes: { type: string_set, size: 14/60, doc: "The library's labels on the tool, scanned at the desk. A tool can carry several (one per part of a kit)." }
      addedAt: time
    key:
      pk: "LIB#{libraryId}#TOOL#{toolId}"
      sk: "TOOL"
    indexes:
      ByCategory:
        doc: The catalogue, by category then name. Status is projected, so lending doesn't move entries.
        pk: "LIB#{libraryId}#CAT#{category}"
        sk: "{name|lower}#{toolId}"
        project: [status, tags]
        accept:
          sparse-index: "Donated tools are added before a steward sorts them; they join the catalogue once they have a category."
    unique:
      Serial:
        doc: Stops the same physical tool being catalogued twice. Tools without a serial number make no claim.
        fields: [libraryId, serialNumber]
      Barcode:
        doc: "Each label identifies one tool: one claim per barcode, so the desk can look a tool up by any of them."
        fields: [libraryId, barcodes]
    counters:
      ToolCounts:
        doc: Holds the library's catalogue numbers.
        pk: "LIB#{libraryId}"
        sk: "COUNTS#TOOLS"
        values:
          available: { count: true, where: { status: available } }
          onLoan: { count: true, where: { status: onLoan } }
          retired: { count: true, where: { status: retired } }
    access:
      Get: { get: key, freshness: eventual, rate: 20 }
      Catalogue: { query: ByCategory, page: 25, freshness: eventual, rate: 10 }
      GetByBarcode: { get: { unique: Barcode }, freshness: immediate, rate: 2, doc: "The desk scanning a label, perhaps one just attached." }
    writes:
      Add: { create: true, set: { status: available } }
      EditDetails: { patch: [name, manual, tags], versioned: required }
      Relabel: { update: [barcodes], doc: "Replaces the tool's labels: new ones are claimed, dropped ones freed." }
      Retire:
        set: { status: retired }
        when: { status: available }
        requires:
          Hold: { key: { libraryId: libraryId, toolId: toolId }, optional: true, consume: true }
        doc: Takes the tool out of the catalogue, cancelling any hold on it.
    # Tools go on and off loan through Loan.Borrow and Loan.Return, which change them in the same
    # transaction as the loan.
    volume: { typical: 60, max: 5000 }
    accept:
      large-field: "Most manuals are short (2 KB typically); only a few tools carry long ones, and those tools' writes cost more. Splitting the manual out would add a read to every tool page, for cents a month."

  Loan:
    doc: A member borrowing a tool.
    version: 2 # v2 added checkedInBy
    fields:
      libraryId: { type: string, example: lib_1 }
      toolId: { type: string, example: t_42 }
      loanId: { type: string, example: ln_9, doc: "A ULID, so a tool's loans sort by time." }
      memberId: { type: string, required: true, example: m_7 }
      toolName: { type: string, size: 20/60, snapshot_of: Tool.name, doc: "The tool's name when it was borrowed, shown in \"my loans\" without reading the tool." }
      status: { type: enum, values: [active, returned], doc: Set by Borrow and Return; callers never choose it. }
      borrowedAt: { type: time, required: true }
      dueAt: { type: time, required: true, example: "2026-10-12T17:00:00Z" }
      returnedAt: time
      checkedInBy: { type: string, ref: Member, doc: "The steward who took the tool back. A Member's memberId, under another name: the loan's memberId is its borrower." }
      notes: { type: string, size: 0/1000, doc: Condition notes from the steward. Not listed. }
    key:
      pk: "LIB#{libraryId}#TOOL#{toolId}"
      sk: "LOAN#{loanId}"
    indexes:
      ByMember:
        # No strategy: MyLoans needs immediate freshness, so dynago makes this a copy.
        doc: "A member's current loans, soonest due first. A member sees a loan the moment they take it; returned loans drop out."
        pk: "LIB#{libraryId}#MEMBER#{memberId}"
        sk: "MYLOAN#{dueAt}#{toolId}#{loanId}"
        where: { status: active }
        matches: 0.02   # a tool has about 20 loans in its history, and at most one of them is active
        project: [toolName, dueAt]
      Overdue:
        doc: Active loans by due date, for the steward's reminder run. Returned loans drop out.
        pk: "LIB#{libraryId}#DUE"
        sk: "{dueAt}#{loanId}"
        where: { status: active }
        matches: 0.02
        project: [memberId, toolName]
    counters:
      MemberLoans:
        doc: Counts each member's loans.
        pk: "LIB#{libraryId}#MEMBER#{memberId}"
        sk: "LOANS"
        values:
          active: { count: true, where: { status: active }, limit: arg, doc: Capped by the member's maxLoans. }
      LoanTotals:
        doc: "Counts every loan the library has made. Sharded to show how: a counter item that every write of a busy entity touches starts to see transaction conflicts at about 20 writes/s, so each shard should take no more than about 10. This library's rate needs one item."
        pk: "LIB#{libraryId}#LOANTOTALS"
        sk: "TOTALS"
        shards: 4
        values:
          started: count
    access:
      Get: { get: key, freshness: immediate, doc: "A loan as the steward checks it in, straight after any change." }
      History: { query: key, order: desc, page: 20, project: [memberId, status, borrowedAt, dueAt, returnedAt], freshness: eventual, rate: 1, doc: "A tool's loans, newest first, without the notes." }
      MyLoans: { query: ByMember, freshness: immediate, rate: 5, doc: "A member's current loans, soonest due first." }
      Overdue: { query: Overdue, range: dueAt, freshness: eventual, rate: 0.01 }
      ActiveLoans: { counter: MemberLoans, freshness: eventual, doc: "Shown beside the member's loans. Borrow enforces the cap itself." }
      Totals: { counter: LoanTotals, freshness: eventual }
      Export: { scan: true, freshness: eventual, reason: "The yearly lending report reads every loan once, overnight. No request path reads it." }
    writes:
      Borrow:
        create: true
        set: { status: active }
        requires:
          Member: { key: { libraryId: libraryId, memberId: memberId }, when: { status: active } }
          Tool:
            key: { libraryId: libraryId, toolId: toolId }
            when: { status: available }
            set: { status: onLoan }
          Hold:
            key: { libraryId: libraryId, toolId: toolId }
            optional: true
            when: { memberId: "{memberId}" }
            consume: true
        rate: 2
      Return:
        update: [returnedAt, checkedInBy]
        set: { status: returned }
        when: { status: active }
        requires:
          Tool:
            key: { libraryId: libraryId, toolId: toolId }
            when: { status: onLoan }
            set: { status: available }
        rate: 2
      Extend: { update: [dueAt], when: { status: active } }
      AddNote: { patch: [notes] }
    # A tool's loans accumulate: its whole lending history stays in its partition.
    # A loan holds two members' keys (borrower and steward), so `via` says loans are counted per
    # borrower.
    volume: { typical: 20, max: 500, by: { Member: { typical: 60, max: 400, via: memberId } } }

  Hold:
    doc: "A tool reserved for a member to collect, with a pickup code. While it is live, only that member can borrow the tool; borrowing collects it. Lapses after two days."
    fields:
      libraryId: { type: string, example: lib_1 }
      toolId: { type: string, example: t_42 }
      memberId: { type: string, required: true }
      codeHash:
        type: string
        size: 64
        required: true
        doc: "HMAC-SHA256 of the pickup code under a server-side secret, hex-encoded. Neither the code nor a plain hash of it is stored: keys end up in backups and logs, and a short code's plain hash is reversed by trying every code."
      createdAt: time
      expiresAt: { type: time, required: true, doc: "When the hold lapses. Required: a hold without one would reserve the tool forever." }
    key:
      pk: "LIB#{libraryId}#TOOL#{toolId}"
      sk: "HOLD"
    ttl: expiresAt
    indexes:
      ByCode:
        doc: "Finds a hold from its code. A GSI, not a claim: the hold expires by TTL and its index entry goes with it, whereas a claim would be left behind."
        pk: "HOLDCODE#{codeHash}"
        project: [memberId, expiresAt]
        accept:
          unenforced-unique: "Codes are HMACs under a server-side secret: two holds sharing one is negligibly unlikely, and a claim would outlive the hold's TTL."
    access:
      Get: { get: key, freshness: immediate, doc: "The member's hold, straight after placing it." }
      FindByCode: { query: ByCode, page: 1, max_page: 1, freshness: eventual, rate: 1 }
    writes:
      Place:
        create: true
        requires:
          Tool: { key: { libraryId: libraryId, toolId: toolId }, when: { status: available } }
          Member: { key: { libraryId: libraryId, memberId: memberId }, when: { status: active } }
      Release: delete
    # Few tools are on hold at any moment.
    volume: { typical: 0.02 }
