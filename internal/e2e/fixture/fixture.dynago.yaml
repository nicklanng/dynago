# yaml-language-server: $schema=../../../schema/dynago.schema.json
#
# A test-only schema for shapes the example doesn't use. An account hands over to its successor:
# both change in one transaction, both feed the tenant's counter item (so their changes must be
# merged into one update), and the successor's region counter is keyed by a field the requirement
# doesn't pin (so the successor is always read first).
dynago: 1
package: fixture

table:
  name: fixture

entities:
  Account:
    fields:
      tenantId: string
      accountId: string
      region: string
      status: { type: enum, values: [pending, active, closed] }
      successorId: string
    key:
      pk: "T#{tenantId}"
      sk: "ACCOUNT#{accountId}"
    counters:
      TenantCounts:
        pk: "T#{tenantId}"
        sk: "COUNTS"
        values:
          active: { count: true, where: { status: active } }
          closed: { count: true, where: { status: closed } }
      RegionCounts:
        pk: "R#{region}"
        sk: "COUNTS"
        values:
          active: { count: true, where: { status: active } }
    access:
      Get: get
      Tenant: { counter: TenantCounts }
      Region: { counter: RegionCounts }
      Export: { scan: true, page: 2, reason: the audit export reads every account }
    writes:
      Open: create
      Activate: { set: { status: active }, when: { status: pending } }
      HandOver:
        update: [successorId]
        set: { status: closed }
        when: { status: active }
        requires:
          Account:
            key: { tenantId: tenantId, accountId: successorId }
            when: { status: pending }
            set: { status: active }

  # A parcel moves through a depot's states. Its index, counter values and preconditions exclude a
  # state (not) or list several (in), rather than naming one.
  Parcel:
    fields:
      depotId: string
      parcelId: string
      state: { type: enum, values: [received, shelved, out, returned, lost] }
      note: string
      fragile: bool
      damages: { type: int, doc: How many damage reports name the parcel. Listed with the parcels on site. }
      disputes: int
      lastDispute: string
    key:
      pk: "D#{depotId}"
      sk: "PARCEL#{parcelId}"
    indexes:
      OnSite:
        doc: The parcels physically in the depot.
        pk: "D#{depotId}#ONSITE"
        sk: "P#{parcelId}"
        where: { state: { in: [received, shelved, returned] } }
        project: [state, damages]
      Known:
        doc: Every parcel that isn't lost.
        pk: "KNOWN#{depotId}"
        sk: "P#{parcelId}"
        where: { state: { not: lost } }
        project: keys
    counters:
      DepotParcels:
        pk: "D#{depotId}"
        sk: "COUNTS"
        values:
          onSite: { count: true, where: { state: { in: [received, shelved, returned] } } }
          known: { count: true, where: { state: { not: lost } } }
    access:
      Get: get
      OnSite: { query: OnSite, freshness: immediate }
      Known: { query: Known }
      Counts: { counter: DepotParcels }
    writes:
      Receive: { create: true, set: { state: received } }
      Shelve: { set: { state: shelved }, when: { state: received } }
      SendOut: { set: { state: out }, when: { state: { in: [received, shelved] } } }
      Lose: { set: { state: lost }, when: { state: { not: lost } } }
      Annotate: { update: [note], when: { state: { not: lost } } }

  # A damage report can only be filed against a parcel that is still on site. Filing one counts on
  # the parcel (add) and marks it fragile if the report says so (patch), leaving the mark alone
  # otherwise. The count is listed in the OnSite copy, so the parcel is read first; a dispute
  # changes nothing derived, so its addition and patch go on one update without a read.
  Damage:
    fields:
      depotId: string
      parcelId: string
      damageId: string
      detail: string
      fragile: bool
    key:
      pk: "D#{depotId}"
      sk: "DAMAGE#{parcelId}#{damageId}"
    access:
      Get: get
    writes:
      File:
        create: true
        requires:
          Parcel:
            key: { depotId: depotId, parcelId: parcelId }
            when: { state: { in: [received, shelved, returned] } }
            add: { damages: 1 }
            patch: { fragile: "{fragile}" }
      Dispute:
        update: [detail]
        requires:
          Parcel:
            key: { depotId: depotId, parcelId: parcelId }
            when: { state: { not: lost } }
            set: { note: disputed }
            add: { disputes: 1 }
            patch: { lastDispute: "{detail}" }
